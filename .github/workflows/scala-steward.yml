name: Run Scala Steward on the managed repositories

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Repository to update. Leave empty to update every repository managed by the GitHub App."
        required: false
        default: ""
      extra-options:
        description: |
          Extra options to append to base `.scala-steward.conf`. For example, to instruct Scala Steward to just
          update SBT you can set this to: `updates.allow = [{ groupId = "org.scala-sbt", artifactId = "sbt" }]`
          to just update SBT.
        required: false
        default: ""
  schedule:
    - cron: "0 5 1,15 * *"

jobs:
  get-repositories:
    name: Select repositories to update
    runs-on: ubuntu-22.04
    outputs:
      repositories: ${{ steps.repositories.outputs.repositories }}
    steps:
      - name: Generate token
        id: github_app
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2.1.0
        with:
          app_id: ${{ secrets.APP_ID }}
          installation_retrieval_mode: id
          installation_retrieval_payload: ${{ secrets.APP_INSTALLATION_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Select repositories to update
        id: repositories
        run: |
          if [ "${{ github.event.inputs.repository }}" != "" ]; then
            echo "repositories=[\"alejandrohdezma/${{ github.event.inputs.repository }}\"]" >> $GITHUB_OUTPUT
          else
            echo "repositories=$(gh api installation/repositories -q '.repositories | map(.full_name)')" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ steps.github_app.outputs.token }}

  run-scala-steward:
    name: ${{ matrix.repo }} - Dependency update
    runs-on: ubuntu-latest
    needs: get-repositories
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJson(needs.get-repositories.outputs.repositories) }}
    steps:
      - name: Generate token
        id: github_app
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2.1.0
        with:
          app_id: ${{ secrets.APP_ID }}
          installation_retrieval_mode: id
          installation_retrieval_payload: ${{ secrets.APP_INSTALLATION_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout project
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Append extra options
        run: echo "${{ github.event.inputs.extra-options }}" >> .github/.scala-steward.conf

      - name: Check if repository uses sbt-dependencies
        id: check_sbt_dependencies
        run: |
          if gh api "repos/${{ matrix.repo }}/contents/project/dependencies.conf" --silent 2>/dev/null; then
            echo "uses_sbt_dependencies=true" >> "$GITHUB_OUTPUT"
          else
            echo "uses_sbt_dependencies=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ steps.github_app.outputs.token }}

      - name: Launch Scala Steward on ${{ matrix.repo }}
        if: steps.check_sbt_dependencies.outputs.uses_sbt_dependencies == 'false'
        uses: scala-steward-org/scala-steward-action@6162b21b93d4be314a61ce0462fd026630132fee # v2.96.0
        with:
          github-repository: ${{ matrix.repo }}
          github-app-auth-only: "true"
          github-app-id: ${{ secrets.APP_ID }}
          github-app-installation-id: ${{ secrets.APP_INSTALLATION_ID }}
          github-app-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Copy the Scala Steward configuration out of the workspace
        if: steps.check_sbt_dependencies.outputs.uses_sbt_dependencies == 'true'
        run: cp .github/.scala-steward.conf "$RUNNER_TEMP/scala-steward.conf"

      - name: Checkout ${{ matrix.repo }} at the workspace root
        if: steps.check_sbt_dependencies.outputs.uses_sbt_dependencies == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ matrix.repo }}
          token: ${{ steps.github_app.outputs.token }}

      - name: Setup Java and sbt
        if: steps.check_sbt_dependencies.outputs.uses_sbt_dependencies == 'true'
        uses: coursier/setup-action@fd1707a76b027efdfb66ca79318b4d29b72e5a02 # v3.0.0
        with:
          jvm: liberica:17
          apps: sbt

      - name: Update dependencies using sbt-dependencies
        if: steps.check_sbt_dependencies.outputs.uses_sbt_dependencies == 'true'
        uses: alejandrohdezma/sbt-dependencies@8553131c34cff510161152bceed097793a2ac920 # v0.46.0
        with:
          config-file: ${{ runner.temp }}/scala-steward.conf
          github-token: ${{ steps.github_app.outputs.token }}
          pr-body: |
            Dependency updates from `sbt updateAllDependencies`.

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
